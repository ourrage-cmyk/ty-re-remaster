; TY HD Renderer settings = the 'Medium' preset (about 80 fps at 2560x1440 on an RX 7600 XT, default camera). TYLauncher writes these; see README.md / PERFORMANCE.md for all keys.
[ao]
Enable=1
Legacy=0
Slices=3
Steps=6
[gi]
Enable=0
Mode=1
Rays=1
[atmos]
Enable=1
Froxel=1
Steps=24
ContactShadows=0
Intensity=1.2
Desaturation=0.3
HazeLift=0.15
[tess]
Enable=1
Scope=skin
MaxLevel=8
[shadows]
Patch=1
MapScale=2
Taps=16
[post]
Enable=1
AA=2
Brightness=0.94
Saturation=1.18
[pbr]
Enable=1
DetailStrength=1.0
DetailScale=1.0
; 1 = water-tagged draws (emissive/transparent texture tags) skip the sky Fresnel term; 0 = unchanged
SkyFresnelSkipWater=0
; #9 step 1: 1 = log additive draws per albedo texture every 600 frames (tyrender.log, [spill] lines). Logging only; default off
[spill]
LogEmitters=0
; #8 footprint glow: 1 = cap the luminance of decal draws (Names) at Max before the output. 0 = unchanged (default, safe)
[decal]
Clamp=0
Max=0.9
Names=ty_footprint.dds,ty_footprint2.dds
[light]
Enable=1
[shots]
; A/B screenshot hotkey (abshot.inl). Key = F1..F24 or a virtual-key number, 0 = off. Preset is written by the launcher and only names the files.
Key=F11
[portability]
; 1 = tessellation stages are not compiled on GL contexts below 4.0 (they cannot link there). 0 = always attempt them.
TessVersionGate=1
