; TY HD Renderer settings = the 'Medium' preset (about 80 fps at 2560x1440 on an RX 7600 XT, default camera). TYLauncher writes these; see README.md / PERFORMANCE.md for all keys.
[ao]
Enable=1
Legacy=0
Slices=3
Steps=6
[gi]
Enable=0
Mode=1
Rays=1
; #7 cost: 1 = trace only a checkerboard half of the GI pixels each frame (the rest keep last frame's result, temporal blend does the rest). 0 = every pixel.
Checker=0
; #7 cost: 1 = the a-trous denoiser uses a 3x3 ring instead of 5x5 for pixels whose view depth is beyond [lod] Start (same threshold as the GI keep). 0 = 5x5 everywhere (default). Untested: check [gpusub] atrous ms and noise steps at far views.
AtrousFar=0
; #10 distance LOD. Enable is the master switch; each effect needs its own key as well (GI, AO, Fog). All 0 = unchanged (default).
; Far pixels do less work for the selected effects: full quality before Start, the kept share falls smoothly to MinScale at End
; (view depth, world units). GI = screen-space GI rays (needs [gi] Enable=1), AO = horizon steps (needs [ao]), Fog = froxel fog samples (needs [atmos]).
; Shadow = cascades 2 and 3 (the far distance bands) drop the 3x3/4x4 filter grid and use the 8 probe taps + crack closing (needs [shadows] Patch=1).
; Tess/relief (already distance-faded by [tess] FadeStart/ReliefFadeStart) is not wired.
[lod]
Enable=0
GI=0
AO=0
Fog=0
Shadow=0
Start=1500
End=6000
MinScale=0.35
; #10 tessellation: 1 = tess edge levels fall smoothly to MinScale between Start and End (same ramp as the GI rays above). 0 = unchanged (default)
TessEnable=0
[atmos]
Enable=1
Froxel=1
Steps=24
ContactShadows=0
Intensity=1.2
Desaturation=0.3
HazeLift=0.15
; Sky and painted rock (red rock on the skyline): fog depth as a fraction of MaxDist. 0.12 = the old fixed value (rock nearly clear)
SkyFogDist=0.45
[tess]
Enable=1
Scope=skin
MaxLevel=8
[shadows]
Patch=1
MapScale=2
Taps=16
[post]
Enable=1
AA=2
Brightness=0.94
Saturation=1.18
[pbr]
Enable=1
DetailStrength=1.0
DetailScale=1.0
; 1 = water-tagged draws (emissive/transparent texture tags) drop bump, relief, specular and sky Fresnel, so the water colour is frame-stable and does not flicker blue on Ty (issue #5). 0 = unchanged
WaterStable=1
; #5 bisect: bitmask, 0 = off. 1 = PBR spec+Fresnel+sheen off, 2 = bump/relief off, 4 = atmos WaterFog off, 8 = hemisphere+shadow tint off (all draws). Logs [dbgwater] lines
DebugWater=0
; 1 = water-tagged draws skip only the sky Fresnel term (older subset of WaterStable); 0 = unchanged
SkyFresnelSkipWater=0
; #9 step 1: 1 = log additive draws per albedo texture every 600 frames (tyrender.log, [spill] lines). Logging only; default off
[spill]
LogEmitters=0
; #8 footprint glow: 1 = cap the luminance of decal draws (Names) at Max before the output. 0 = unchanged (default, safe)
[decal]
Clamp=0
Max=0.9
Names=ty_footprint.dds,ty_footprint2.dds
[light]
Enable=1
; #4 fog consistency (default off, playtest first): SeeThruDepth=1 writes depth for non-emissive see-through draws (foliage cards, water) before the fog pass;
; LateEmitters=1 lets the [fog] LateBoost multiplier also haze emissive draws drawn after the fog pass (cave fire). LateBoost (tyrender.cpp) must be > 1 for it to act.
[fog]
SeeThruDepth=0
LateEmitters=0
; Water fog (#4): multiplier on the engine fog of water-named see-through draws (texture name contains "water"), used instead of LateBoost for them.
; Water is drawn after the volumetric fog pass, so it is otherwise unfogged. 1.0 = off. Try 2.0 to 3.0 in playtest.
WaterBoost=1.0
; LateEmitBoost (#4 fire): multiplier on the engine fog of emissive draws (fire, glow, particles) that come after the fog pass, which the volumetric fog never reaches. 1.0 = off (default). Try 2.0 to 3.0 in playtest; check that the fire is hazed and glow textures are not washed out.
LateEmitBoost=1.0
; Foliage fog (#4): multiplier on the engine fog of see-through draws that are not water (tree cards) and are drawn after the fog pass, which the volumetric fog never reaches. 1.0 = off (LateBoost applies). Try 2.0 to 3.0 in playtest.
FoliageBoost=1.0
; WaterMaskSoft (#5): 0 = hard cut on the GI source mask (alpha < 0.25) that thickens the atmos fog over water. 1 = 3x3 averaged mask with a smoothstep edge, so the cut no longer flickers on Ty's submerged parts. Untested: compare 0 and 1 in playtest.
WaterMaskSoft=0
; WaterNames (#4): comma-separated file-name substrings (case-insensitive) that count as water for WaterBoost, in addition to names containing "water". Empty = off (default). Lily-pad texture names still to be confirmed from a playtest texture log.
WaterNames=
[shots]
; A/B screenshot hotkey (abshot.inl). Key = F1..F24 or a virtual-key number, 0 = off. Preset is written by the launcher and only names the files.
Key=F11
[portability]
; 1 = tessellation stages are not compiled on GL contexts below 4.0 (they cannot link there). 0 = always attempt them.
TessVersionGate=1

[emit]
; phase 2 (plan section 4): emitter light injection. Enable=0 (default) runs none of it.
; Strength: composite gain. Radius: blur step in half-res texels (all emitters share it). MaxEmitters: cap on emitter draws splatted per frame.
Enable=0
Strength=1.0
Radius=12
MaxEmitters=16


; #12 settings overlay (overlay.inl): key toggles the live panel (Up/Down select, Left/Right change, Enter keep, Esc/toggle discard). 0 = off. Default F10: the panel is only drawn after the key is pressed, so nothing changes until then. Fixes #12 F10 no-op from playtest 4a2ef95 (the key was 0 in the shipped ini). Live verification still needed.
[overlay]
Key=F10
